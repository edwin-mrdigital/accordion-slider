<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Swiper Slider</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.css">
   <link rel="stylesheet" href="css/swiper-style.css">
</head>

<body>
   <section class="py-5">
      <div class="container-fluid px-0">
         <!-- <div class="row"> -->
            <!-- <div class="col-12"> -->

               <div id="swiperOne" class="swiper swiper-one">
                  <div class="swiper-wrapper">
                     <div class="swiper-slide"><div class="block"><h2>1</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>2</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>3</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>4</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>5</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>6</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>7</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>8</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>9</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>10</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>11</h2></div></div>
                     <div class="swiper-slide"><div class="block"><h2>12</h2></div></div>
                  </div>
                  <div class="swiper-button-prev"></div>
                  <div class="swiper-button-next"></div>
               </div>


            <!-- </div> -->
         <!-- </div> -->
      </div>
   </section>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"></script>
   <script src="js/swiper-script.js"></script>
</body>

</html>
